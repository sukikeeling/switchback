version: "3.9"

services:
  switchback-sidecar:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: switchback-sidecar
    ports:
      - "8780:8780"
    environment:
      - PYTHONUTF8=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    volumes:
      - switchback-data:/app/switchback-run
    restart: unless-stopped

  higress-gateway:
    image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/all-in-one:latest
    container_name: switchback-higress
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./higress-config.yaml:/etc/higress/config.yaml:ro
    depends_on:
      - switchback-sidecar

  matrix-synapse:
    image: matrixdotorg/synapse:latest
    container_name: switchback-matrix
    ports:
      - "8008:8008"
    environment:
      - SYNAPSE_SERVER_NAME=switchback.local
      - SYNAPSE_REPORT_STATS=no

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: switchback-jaeger
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: switchback-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - switchback-sidecar

  grafana:
    image: grafana/grafana:11.0.0
    container_name: switchback-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=switchback
    volumes:
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/switchback-rail.json:ro
    depends_on:
      - prometheus
      - jaeger

volumes:
  switchback-data:
